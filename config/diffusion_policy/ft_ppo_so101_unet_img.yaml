# DPPO fine-tuning of the pretrained blue-cube visual Diffusion Policy on the
# full simulated pick-and-place task. Adapted from the pinned submodule's
# cfg/robomimic/finetune/transport/ft_ppo_diffusion_unet_img.yaml (the two-camera
# variant); the actor block below must stay identical to
# pretrain_so101_unet_img.yaml, because `network_path` loads that checkpoint's
# weights into it.
#
# The reward is the sparse full-task one: 1.0 on the control tick where the
# success oracle confirms a settled placement, nothing otherwise. An episode
# therefore returns exactly 1.0 or 0.0, so `avg_episode_reward` reads directly
# as the success rate.
defaults:
  - _self_

hydra:
  run:
    dir: ${logdir}

_target_: pick_and_place.dppo_rl.agent.PickAndPlacePPOImgAgent

name: so101_ft_ppo_diffusion_unet_img_ta${horizon_steps}_te${act_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_BASE_POLICY}
normalization_path: ${oc.env:DPPO_DATA_DIR}/normalization.npz

seed: 42
device: cuda:0
obs_dim: 6
action_dim: 6
denoising_steps: 100
cond_steps: 2
img_cond_steps: 2
horizon_steps: 16

# Eight of the sixteen predicted actions are executed per query, the same chunk
# schedule the pretrained checkpoint's closed-loop baseline was measured with.
act_steps: 8

# The rollout sampler is the ten-step DDIM the baseline was evaluated with. Only
# the last five of those steps are fine-tuned: DPPO's own pixel configs fine-tune
# five, and the earlier steps carry the coarse chunk shape that behavior cloning
# already got right.
use_ddim: True
ft_denoising_steps: 5

env:
  name: so101_pick_and_place
  n_envs: 32
  # Control ticks per episode. 150 at 10 Hz is 15 s, the same episode budget the
  # frozen 30 Hz evaluation manifests allow with 450 steps.
  max_episode_steps: 150
  control_hz: 10.0
  # Render straight to the resolution the dataset's videos were recorded at, so
  # the policy sees one area-downsample hop to 96x96, as its training frames did.
  render_hw: [720, 960]
  # Training scenes come from this seed stream; the evaluation manifests use
  # bases 1701 and 2701, so the two can never overlap.
  scene_seed_base: 5000000
  # The appearance this checkpoint was trained in. Its dataset was re-rendered
  # with a solid blue cube, and against the compiled AprilTag cube the policy
  # cannot see the object at all: 0/4 contact attempts in the pre-flight check.
  scene_appearance: blue-cube
  # Potential-based shaping weight, in reward per metre; 0 keeps the reward the
  # pure sparse settled placement that the plan calls for. Being potential-based
  # (gamma * phi(s') - phi(s)) it cannot change which policy is optimal, so it is
  # a variance-reduction device rather than a different task.
  shaping_weight: 0.0
  # Emit privileged simulator state for the asymmetric critic below. The actor
  # never reads it, so the deployed policy is unchanged.
  privileged_obs: True
  # Diagnostic only; see EnvConfig.debug_action_reward.
  debug_action_reward: False
  mujoco_gl: egl
  save_video: False
  # An episode's summed reward is 1.0 exactly when it succeeded, and DPPO divides
  # the best per-chunk reward by act_steps before this comparison.
  best_reward_threshold_for_success: ${eval:'1 / ${act_steps}'}

shape_meta:
  obs:
    rgb:
      shape: [6, 96, 96]
    state:
      shape: [6]
    # Critic-only. Cube pose, target, their difference and planar distance,
    # gripper-to-cube distance, contact/grasp/open flags, elapsed fraction.
    privileged:
      shape: [13]
  action:
    shape: [6]

wandb:
  entity: null
  project: pick-and-place-dppo
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 301
  n_critic_warmup_itr: 2
  # Model steps per environment per iteration. Twenty chunks of eight ticks is
  # 160 ticks, slightly over one episode, so an iteration is about
  # n_envs episodes.
  n_steps: 40
  gamma: 0.999
  augment: True
  grad_accumulate: 10
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: ${train.n_train_itr}
    warmup_steps: 10
    min_lr: 1e-5
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: ${train.n_train_itr}
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 25
  val_freq: 25
  render:
    freq: 1
    num: 0
  # PPO specific
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 500
  # DPPO asserts this divides n_envs, and the launcher overrides n_envs, so it
  # is derived rather than pinned.
  logprob_batch_size: ${eval:'4 * ${env.n_envs}'}
  update_epochs: 10
  vf_coef: 0.5
  target_kl: 1

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  # Clip applied to the denoised sample. At 1.0 it sits exactly on the
  # normalized action bounds, where ~25% of this task's gripper commands live
  # (the gripper is min-max normalized between fully closed and fully open, so
  # it is effectively binary). Sampling is clipped there while the Gaussian
  # likelihood behind the policy gradient is not, which biases that dimension's
  # gradient. Declared here so it can be overridden.
  denoised_clip_value: 1.0
  # HP to tune
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  #
  use_ddim: ${use_ddim}
  ddim_steps: 10
  learn_eta: False
  eta:
    base_eta: 1
    input_dim: ${obs_dim}
    mlp_dims: [256, 256]
    action_dim: ${action_dim}
    min_eta: 0.1
    max_eta: 1.0
    _target_: model.diffusion.eta.EtaFixed
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.unet.VisionUnet1D
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    num_img: 2
    img_cond_steps: ${img_cond_steps}
    augment: False
    spatial_emb: 128
    diffusion_step_embed_dim: 32
    dim: 64
    dim_mults: [1, 2, 4]
    kernel_size: 5
    n_groups: 8
    smaller_encoder: False
    cond_predict_scale: True
    groupnorm_eps: 1e-4
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  # Asymmetric critic: privileged state in, value out. The image critic could
  # not regress this task's sparse return from 96x96 pixels -- it correlated
  # with realized returns at r = 0.33, so advantages were ~89% noise, which is
  # what degraded the policy in every earlier run.
  critic:
    _target_: pick_and_place.dppo_rl.privileged_critic.PrivilegedCritic
    privileged_dim: ${shape_meta.obs.privileged.shape[0]}
    cond_steps: ${cond_steps}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
