# DSRL steering of the pretrained blue-cube visual Diffusion Policy.
#
# Deliberately the same file shape as ft_ppo_so101_unet_img.yaml, and the `model`
# block below must stay identical to it: the same `PPODiffusion` is instantiated
# from the same pretrained checkpoint, and DSRL simply never trains it. Keeping
# one model description means the steered policy and the DPPO-fine-tuned policy
# are provably the same network evaluated the same way, so a difference between
# them is the method and not the plumbing.
#
# What differs from the DPPO config:
#
#   - No `train:` PPO block. Nothing back-propagates through the denoiser, so
#     none of the trust-region, GAE or denoising-clip knobs apply.
#   - The critic here is not the model's. `PrivilegedCritic` is a state-value
#     function V(s); DSRL needs an action-value Q(s, w), which lives in
#     pick_and_place.dsrl.sac and is built from the observation at runtime. The
#     `critic` entry below is left in place only because `PPODiffusion.__init__`
#     requires one; it is never stepped.
#   - `denoised_clip_value` and `randn_clip_value` still matter, because they are
#     inside the denoising loop DSRL calls forward.

defaults:
  - _self_

hydra:
  run:
    dir: ${logdir}

name: so101_dsrl_unet_img_ta${horizon_steps}_te${act_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/dsrl/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_BASE_POLICY}
normalization_path: ${oc.env:DPPO_DATA_DIR}/normalization.npz

seed: 42
device: cuda:0
obs_dim: 6
action_dim: 6
denoising_steps: 100
cond_steps: 2
img_cond_steps: 2
horizon_steps: 16
act_steps: 8

# The ten-step DDIM the baseline was evaluated with. DSRL requires it: DDPM
# sampling injects fresh noise at every denoising step, so the action would not
# be a function of the latent alone. `ft_denoising_steps` is irrelevant here --
# no denoising step is fine-tuned -- but PPODiffusion demands the key.
use_ddim: True
ft_denoising_steps: 5

env:
  name: so101_pick_and_place
  n_envs: 32
  max_episode_steps: 150
  control_hz: 10.0
  render_hw: [720, 960]
  # Same disjoint training stream the DPPO runs drew from, so a DSRL result and
  # a DPPO result are comparable scene for scene and neither can touch the
  # frozen evaluation manifests (bases 1701 and 2701) or the 7M validation block.
  scene_seed_base: 5000000
  scene_appearance: blue-cube
  # Pay the success reward on every tick the cube stays settled, rather than
  # once. This matters more to an off-policy Q-learner than it did to PPO: a
  # 0-or-1 episode return is the maximum-variance form the signal can take, and
  # every bootstrapped target inherits that variance.
  dense_success_reward: True
  shaping_weight: 0.0
  # Read by the DSRL critic, never by the actor. The deployed policy still sees
  # cameras and proprioception alone.
  privileged_obs: True
  debug_action_reward: False
  mujoco_gl: egl
  save_video: False

shape_meta:
  obs:
    rgb:
      shape: [6, 96, 96]
    state:
      shape: [6]
    privileged:
      shape: [13]
  action:
    shape: [6]

wandb:
  entity: null
  project: pick-and-place-dsrl
  run: ${now:%H-%M-%S}_${name}

# The latent-noise learner. Defaults follow the paper's Table 3 (common online
# hyperparameters) and Table 4 (Robomimic image tasks), which is the closest
# published setting to this one.
dsrl:
  # Largest absolute value of a latent-noise action; the paper's b_W.
  action_magnitude: 1.5
  hidden_dim: 2048
  n_layers: 3
  actor_lr: 3e-4
  critic_lr: 3e-4
  temperature_lr: 3e-4
  # Below the paper's 0.99 because an episode here is at most 19 chunk-steps,
  # and the dense settled reward pays out over the tail of it.
  gamma: 0.99
  tau: 0.005
  target_entropy: 0.0
  init_temperature: 1.0
  n_critics: 2
  activation: tanh
  privileged_critic: True
  # Parallel environment steps. With n_envs 32 and ~19 chunk-steps per episode,
  # 4000 iterations is ~128k transitions, ~6700 episodes.
  total_iterations: 4000
  # Filled with w ~ N(0, I), i.e. with the base policy's own behavior. 200
  # iterations is ~6400 transitions, ~340 episodes; the paper uses 24k-32k
  # single-env steps on Robomimic, which is the same order once chunking is
  # accounted for.
  warmup_iterations: 200
  gradient_steps_per_iteration: 20
  batch_size: 256
  buffer_capacity: 400000
  save_freq: 100
  log_freq: 10

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  denoised_clip_value: 1.0
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  use_ddim: ${use_ddim}
  ddim_steps: 10
  learn_eta: False
  eta:
    base_eta: 1
    input_dim: ${obs_dim}
    mlp_dims: [256, 256]
    action_dim: ${action_dim}
    min_eta: 0.1
    max_eta: 1.0
    _target_: model.diffusion.eta.EtaFixed
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.unet.VisionUnet1D
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    num_img: 2
    img_cond_steps: ${img_cond_steps}
    augment: False
    spatial_emb: 128
    diffusion_step_embed_dim: 32
    dim: 64
    dim_mults: [1, 2, 4]
    kernel_size: 5
    n_groups: 8
    smaller_encoder: False
    cond_predict_scale: True
    groupnorm_eps: 1e-4
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  # Required by PPODiffusion's constructor and never stepped: DSRL's value
  # function is an action-value over the latent space, not this state-value one.
  critic:
    _target_: pick_and_place.dppo_rl.privileged_critic.PrivilegedCritic
    privileged_dim: ${shape_meta.obs.privileged.shape[0]}
    cond_steps: ${cond_steps}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
