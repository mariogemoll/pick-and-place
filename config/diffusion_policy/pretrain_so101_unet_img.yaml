# Visual behavior cloning using the official DPPO implementation pinned by the
# third_party/dppo submodule. The 10 Hz data makes the 16-step prediction span
# 1.6 seconds; evaluation may override act_steps without changing the model.
defaults:
  - _self_

hydra:
  run:
    dir: ${logdir}

_target_: dppo_ext.train_diffusion_agent.ResumableTrainDiffusionAgent

name: so101_pre_diffusion_unet_img_to${cond_steps}_ta${horizon_steps}_te${act_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/pretrain/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
train_dataset_path: ${oc.env:DPPO_DATA_DIR}/train.npz

seed: 42
device: cuda:0
obs_dim: 6
action_dim: 6
denoising_steps: 100
# The training export is temporally synchronized at 10 Hz. Evaluation must use
# the same cadence so observation history and action chunks remain aligned.
policy_hz: 10
cond_steps: 2
img_cond_steps: 2
horizon_steps: 16
act_steps: 2

wandb:
  entity: null
  project: pick-and-place
  run: ${now:%H-%M-%S}_${name}

shape_meta:
  obs:
    # RGB channels from overhead and wrist, in that order.
    rgb:
      shape: [6, 96, 96]
    state:
      shape: [6]
  action:
    shape: [6]

train:
  n_epochs: 3000
  batch_size: 64
  num_workers: 4
  learning_rate: 1e-4
  weight_decay: 1e-6
  log_freq: 1
  lr_scheduler:
    first_cycle_steps: 3000
    warmup_steps: 100
    min_lr: 1e-5
  save_model_freq: 50
  resume_path: null

model:
  _target_: model.diffusion.diffusion.DiffusionModel
  predict_epsilon: true
  denoised_clip_value: 1.0
  network:
    _target_: model.diffusion.unet.VisionUnet1D
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      # Observation history is concatenated along the channels for each camera.
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    num_img: 2
    img_cond_steps: ${img_cond_steps}
    augment: true
    spatial_emb: 128
    diffusion_step_embed_dim: 32
    dim: 64
    dim_mults: [1, 2, 4]
    kernel_size: 5
    n_groups: 8
    smaller_encoder: false
    cond_predict_scale: true
    groupnorm_eps: 1e-4
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

ema:
  decay: 0.995

train_dataset:
  _target_: agent.dataset.sequence.StitchedSequenceDataset
  use_img: true
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  max_n_episodes: 1000
  cond_steps: ${cond_steps}
  img_cond_steps: ${img_cond_steps}
  # Keep the image dataset in host RAM and transfer individual batches.
  device: cpu
