name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      # check_files_in_repo.sh walks every blob in the history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: "Install script dependencies"
        working-directory: scripts
        run: pnpm i
      - name: "Check for large files"
        run: scripts/check_files_in_repo.sh
      - name: "Check license headers"
        run: scripts/check-license-headers.sh

  ts:
    runs-on: ubuntu-latest
    steps:
      # The exporter compiles the scene, whose meshes live in the SO-ARM100 submodule.
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: "Install JS dependencies"
        working-directory: ts
        run: pnpm i
      # Five test files read ts/public/so101.json, which is generated, not
      # committed. The exporter writes it alongside the .xml it is asked for,
      # and needs only a fraction of the simulation package's dependencies.
      - name: "Install exporter dependencies"
        working-directory: py
        run: |
          uv pip install --system --group export
          uv pip install --system --no-deps -e .
      - name: "Generate AprilTag textures"
        working-directory: py
        run: python scripts/render_apriltag_textures.py --all-defaults
      - name: "Generate web model"
        working-directory: py
        run: python -m pick_and_place.sim.export -o ../ts/public/so101.xml
      # export_generic_robot.py has no unit tests, so running it is its only
      # coverage. Nothing consumes the output; it rides along here because this
      # job already has the exporter installed.
      - name: "Export the generic robots"
        working-directory: py
        run: |
          python scripts/export_generic_robot.py ur5e_mj_description \
            --gripper robotiq_2f85_mj_description -o "$RUNNER_TEMP/ur5e.json"
          python scripts/export_generic_robot.py panda_mj_description -o "$RUNNER_TEMP/panda.json"
      - name: "ESLint the ESLint config"
        working-directory: ts
        run: pnpm eslint -c basic.eslint.config.js basic.eslint.config.js eslint.config.js
      - name: "ESLint"
        working-directory: ts
        run: pnpm eslint src
      - name: "Run TS type checks"
        working-directory: ts
        run: pnpm run typecheck
      - name: "Run TS tests"
        working-directory: ts
        run: pnpm test
      - name: "Run stylelint"
        working-directory: ts
        run: pnpm stylelint "src/**/*.css"
      - name: "Build TS project"
        working-directory: ts
        run: pnpm build

  python:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: ./.github/actions/install-gl
        timeout-minutes: 12
      - name: "Install simulation package dependencies"
        working-directory: py
        run: uv pip install --system -e . --group dev
      - name: "Generate AprilTag textures"
        working-directory: py
        run: python scripts/render_apriltag_textures.py --all-defaults
      - name: "Run ruff on simulation package"
        working-directory: py
        run: python -m ruff check .
      - name: "Check package layering"
        working-directory: py
        run: python scripts/check_package_layering.py
      - name: "Run simulation package tests"
        working-directory: py
        run: python -m pytest -n auto

  meshes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: so101
            generate: python scripts/simplify_meshes.py
            optimize: pnpm run optimize-meshes
          - name: ur5e
            generate: >-
              python scripts/simplify_generic_meshes.py ur5e_mj_description
              --gripper robotiq_2f85_mj_description
            optimize: >-
              pnpm exec bash scripts/optimize-glbs.sh
              ../intermediary-glb-generic/ur5e_mj_description public/ur5e_assets
          - name: panda
            generate: python scripts/simplify_generic_meshes.py panda_mj_description
            optimize: >-
              pnpm exec bash scripts/optimize-glbs.sh
              ../intermediary-glb-generic/panda_mj_description public/panda_assets
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: "Install JS dependencies"
        working-directory: ts
        run: pnpm i
      - uses: ./.github/actions/install-gl
        timeout-minutes: 12
      - name: "Install mesh optimization package dependencies"
        working-directory: mesh_optimization
        run: uv pip install --system -e . --group dev
      - name: "Run ruff on mesh optimization package"
        working-directory: mesh_optimization
        run: python -m ruff check .
      - name: "Generate ${{ matrix.name }} meshes"
        working-directory: mesh_optimization
        run: ${{ matrix.generate }}
      - name: "Optimize ${{ matrix.name }} meshes"
        working-directory: ts
        run: ${{ matrix.optimize }}
