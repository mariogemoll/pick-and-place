[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pick-and-place"
version = "0.0.0"
dependencies = [
    "av",
    "einops",
    "fpdf",
    "gymnasium",
    # diffusion_policy_pretrain imports hydra and omegaconf directly. Pinned to
    # match third_party/dppo, which installs its own hydra-core alongside ours on
    # a training box; an unpinned resolve there would fight it.
    "hydra-core==1.3.2",
    "imageio[ffmpeg]",
    # 0.5.1 pins transformers==5.3.0; newer transformers break lerobot imports.
    # `pi` brings pi0/pi0.5 themselves; `peft` is separate and is what LoRA
    # finetuning needs -- without it wrap_with_peft dies on `import peft` only
    # after the 3.3B checkpoint has finished loading.
    "lerobot[feetech,peft,pi,smolvla]==0.5.1",
    "matplotlib",
    "mujoco",
    "numpy",
    "omegaconf",
    # lerobot pulls opencv-python-headless<4.14, and both wheels install the same
    # cv2/ directory -- whichever lands last wins. Hold this to the same range so
    # the two are at least the same OpenCV, then install this one last to get the
    # GUI build that cv2.imshow needs:
    #   pip install --no-deps --force-reinstall opencv-python==<version>
    "opencv-python>=4.9,<4.14",
    "pupil-apriltags",
    "pyarrow",
    "reportlab",
    "robot_descriptions",
    "scipy",
    "sounddevice",
    "tqdm",
    "wandb",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set instead of relying on ruff's defaults, which change between releases.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pick_and_place = ["*.xml"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.9.0",
]
