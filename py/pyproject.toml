[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pick-and-place"
version = "0.0.0"
dependencies = [
    "av",
    # third_party/diffusion_policy's ConditionalUnet1D, which both flow
    # policies subclass, imports einops directly.
    "einops",
    "fpdf",
    "gymnasium",
    "imageio[ffmpeg]",
    # 0.5.1 pins transformers==5.3.0; newer transformers break lerobot imports.
    # `pi` brings pi0/pi0.5 themselves; `peft` is separate and is what LoRA
    # finetuning needs -- without it wrap_with_peft dies on `import peft` only
    # after the 3.3B checkpoint has finished loading.
    "lerobot[feetech,peft,pi,smolvla]==0.5.1",
    "matplotlib",
    # 3.12.0 shipped an sdist with no wheels, so installs fall back to a
    # source build that needs MUJOCO_PATH. Cap until wheels are published.
    "mujoco<3.12",
    "numpy",
    # lerobot pulls opencv-python-headless<4.14, and both wheels install the same
    # cv2/ directory -- whichever lands last wins. Hold this to the same range so
    # the two are at least the same OpenCV, then install this one last to get the
    # GUI build that cv2.imshow needs:
    #   pip install --no-deps --force-reinstall opencv-python==<version>
    "opencv-python>=4.9,<4.14",
    "pupil-apriltags",
    "pyarrow",
    "reportlab",
    "robot_descriptions",
    "scipy",
    "sounddevice",
    "tqdm",
    # The trainers' configs are dataclasses so a run can be written out and read
    # back. tyro accepts both --batch-size and --batch_size, so adopting it
    # renamed nothing; draccus (already here under lerobot) takes only the
    # underscored form and would have renamed every trainer flag.
    "tyro",
    "wandb",
]

# The one entry point. `pap --help` lists every command; each is a module under
# pick_and_place.cli. Takes effect on install, so an existing environment needs
# a reinstall before the `pap` shim appears -- see AGENTS.md.
[project.scripts]
pap = "pick_and_place.cli.pap:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set instead of relying on ruff's defaults, which change between releases.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pick_and_place = ["*.xml"]

[dependency-groups]
# What the two exporters and the AprilTag texture renderer actually import.
# Installing these alongside the package itself with --no-deps yields working
# exporters without the training stack, which is most of the install.
# The pins mirror the ones in [project.dependencies]; keep them in step.
export = [
    "fpdf",
    "mujoco<3.12",
    "numpy",
    "opencv-python>=4.9,<4.14",
    "robot_descriptions",
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff>=0.9.0",
]
